<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar navbar-custom px-4 shadow-sm">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" style="color: #202124;">
                Complaint Management
            </a>

            <div class="search d-flex align-items-center gap-2">

                <input type="text" id="complaintSearch" class="form-control" placeholder="Search complaints...">

                <select id="searchPriority" class="form-control">

                    <option value="">All</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>

                </select>

                <div id="complaintsContainer"></div>

                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#complaintModal">

                    New

                </button>

            </div>

        </div>
    </nav>


    <div class="container-fluid board">

        <div class="row g-4">


            <div class="col-lg-3 col-md-6">

                <div class="column">

                    <div class="column-header d-flex align-items-center justify-content-between">

                        <div class="column-title new-title">


                            New

                        </div>

                        <span class="count new-count">
                            1
                        </span>

                    </div>

                </div>

            </div>


            <div class="col-lg-3 col-md-6">

                <div class="column">

                    <div class="column-header d-flex align-items-center justify-content-between">

                        <div class="column-title progress-title">


                            In Progress

                        </div>

                        <span class="count progress-count">
                            1
                        </span>

                    </div>

                </div>

            </div>


            <div class="col-lg-3 col-md-6">

                <div class="column">

                    <div class="column-header d-flex align-items-center justify-content-between">

                        <div class="column-title resolved-title">


                            Resolved

                        </div>

                        <span class="count resolved-count">
                            1
                        </span>

                    </div>

                </div>

            </div>


            <div class="col-lg-3 col-md-6">

                <div class="column">

                    <div class="column-header d-flex align-items-center justify-content-between">

                        <div class="column-title closed-title">


                            Closed

                        </div>

                        <span class="count closed-count">
                            1
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <div class="modal fade" id="complaintModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered " style="width: 600px;">

            <div class="modal-content" style="width: 600px;">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Complaint Form
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input type="text" id="customerName" class="form-control" placeholder="Enter customer name">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text" id="phone" class="form-control" placeholder="Enter phone number">

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" id="email" class="form-control" placeholder="Enter email">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Category
                            </label>

                            <select id="category" class="form-select">

                                <option value="Billing">
                                    Billing
                                </option>

                                <option value="Technical">
                                    Technical
                                </option>

                                <option value="Customer Service">
                                    Customer Service
                                </option>

                                <option value="Delivery">
                                    Delivery
                                </option>

                                <option value="General">
                                    General
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Priority
                            </label>

                            <select id="priority" class="form-select">

                                <option value="High">
                                    High
                                </option>

                                <option value="Medium">
                                    Medium
                                </option>

                                <option value="Low">
                                    Low
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Status
                            </label>

                            <select id="status" class="form-select">

                                <option value="New">
                                    New
                                </option>

                                <option value="In Progress">
                                    In Progress
                                </option>

                                <option value="Resolved">
                                    Resolved
                                </option>

                                <option value="Closed">
                                    Closed
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Date
                            </label>

                            <input type="date" id="date" class="form-control">

                        </div>


                        <div class="col-12">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea id="description" class="form-control" rows="4"
                                placeholder="Enter complaint description"></textarea>

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button type="button" class="btn btn-primary" onclick="saveComplaint()">

                        Save Complaint

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/379f6932b1.js" crossorigin="anonymous"></script>
    <script src="index.js"></script>

</body>

</html>
