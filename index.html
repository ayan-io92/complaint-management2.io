<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom px-4 mb-4" style="background-color: #3b6efd;">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center fs-" href="#">
                <i class="fa-regular fa-square me-3 fs-5"></i>
                Complaint Management
            </a>

            <div class="d-flex align-items-center ms-auto gap-3">

                <input type="text" class="form-control search-box" placeholder="Search complaints...">

                <button class="btn btn-new">
                    <i class="fa-solid fa-plus"></i>
                </button>

            </div>

        </div>

        <div class="d-flex align-items-center gap-3" style="color: #fff;">
            <button class="btn btn-link text-primary " data-bs-toggle="modal" data-bs-target="#complaintModal">

                <i class="fa-solid fa-circle-plus d-block"></i>
                New

            </button>

        </div>
    </nav>

    </div>

    <div class="row g-4" style="overflow-y : hidden;">

        <div class="col-lg-3 col-md-6">
            <div class="bg-light rounded shadow-sm overflow-hidden" style="height: 82vh;">

                <div class="bg-primary text-white px-3 d-flex align-items-center justify-content-between"
                    style="height: 43px;">

                    <span>
                        <i class="fa-regular fa-folder me-2"></i>
                        New
                    </span>

                    <span class="badge bg-white text-dark rounded-pill px-3 py-2">
                        0
                    </span>

                </div>

            </div>
        </div>


        <div class="col-lg-3 col-md-6">
            <div class="bg-light rounded shadow-sm overflow-hidden" style="height: 82vh;">

                <div class="bg-warning text-dark px-3 d-flex align-items-center justify-content-between"
                    style="height: 43px;">

                    <span>
                        <i class="fa-solid fa-screwdriver-wrench me-2"></i>
                        In Progress
                    </span>

                    <span class="badge bg-white text-dark rounded-pill px-3 py-2">
                        0
                    </span>

                </div>

            </div>
        </div>


        <div class="col-lg-3 col-md-6">
            <div class="bg-light rounded shadow-sm overflow-hidden" style="height: 82vh;">

                <div class="bg-success text-white px-3 d-flex align-items-center justify-content-between"
                    style="height: 43px;">

                    <span>
                        <i class="fa-regular fa-circle-check me-2"></i>
                        Resolved
                    </span>

                    <span class="badge bg-white text-dark rounded-pill px-3 py-2">
                        0
                    </span>

                </div>

            </div>
        </div>


        <div class="col-lg-3 col-md-6">
            <div class="bg-light rounded shadow-sm overflow-hidden" style="height: 82vh;">

                <div class="bg-dark text-white px-3 d-flex align-items-center justify-content-between"
                    style="height: 43px;">

                    <span>
                        <i class="fa-regular fa-trash-can me-2"></i>
                        Closed
                    </span>

                    <span class="badge bg-white text-dark rounded-pill px-3 py-2">
                        0
                    </span>

                </div>

            </div>
        </div>

    </div>

    <div class="modal fade" id="complaintModal">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h4>Complaint Form</h4>

                    <button class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Customer Name</label>
                            <input type="text" id="customerName" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Phone Number</label>
                            <input type="text" id="phone" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Category</label>

                            <select id="category" class="form-select">
                                <option>Technical</option>
                                <option>Billing</option>
                                <option>Service</option>
                                <option>General</option>
                            </select>

                        </div>

                        <div class="col-12 mb-3">

                            <label>Description</label>

                            <textarea id="description" class="form-control" rows="5"></textarea>

                        </div>

                        <div class="col-md-4">

                            <label>Priority</label>

                            <select id="priority" class="form-select">
                                <option>High</option>
                                <option>Medium</option>
                                <option>Low</option>
                            </select>

                        </div>

                        <div class="col-md-4">

                            <label>Status</label>

                            <select id="status" class="form-select">
                                <option>New</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                                <option>Closed</option>
                            </select>

                        </div>

                        <div class="col-md-4">

                            <label>Date</label>

                            <input type="date" id="date" class="form-control">

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-primary" onclick="saveComplaint()">
                        Save Complaint
                    </button>

                </div>

            </div>

        </div>

    </div>
    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/1c3e5f8b0d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>

</body>

</html>
